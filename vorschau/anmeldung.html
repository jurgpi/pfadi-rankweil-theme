<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vorschau – Anmeldung</title>
<script>(function(){var d=document.documentElement,s=null;try{s=localStorage.getItem("pfadi-theme")}catch(e){}d.setAttribute("data-theme",s||"light")})();</script>
<link rel="stylesheet" href="../pfadi-rankweil/assets/css/main.css">
</head>
<body class="page no-sidebar">
<main id="main">
<header class="page-hero"><div class="container"><nav class="breadcrumbs"><a href="#">Start</a></nav><h1 class="page-hero__title">Anmeldung</h1></div></header>
<div class="container layout layout--page">
<article class="layout__main"><div class="entry-content">
<p>Vorschau des Anmeldeformulars (Struktur von der Live-Seite, ohne Funktion).</p>
<div class="wp-block-contact-form-7-contact-form-selector">
<div class="wpcf7 js"><form action="#" method="post" class="wpcf7-form init" novalidate onsubmit="return false">
<p><label> Vorname Kind<br> <span class="wpcf7-form-control-wrap"><input class="wpcf7-form-control wpcf7-text" type="text" name="a"></span> </label><br> <label> Familienname Kind<br> <span class="wpcf7-form-control-wrap"><input class="wpcf7-form-control wpcf7-text" type="text" name="b"></span> </label> </p>
<p><span class="wpcf7-form-control-wrap"><span class="wpcf7-form-control wpcf7-radio"><span class="wpcf7-list-item first"><label><input type="radio" name="sex" value="M" checked><span class="wpcf7-list-item-label">Männlich</span></label></span><span class="wpcf7-list-item last"><label><input type="radio" name="sex" value="W"><span class="wpcf7-list-item-label">Weiblich</span></label></span></span></span> </p>
<p><label> Straße<br> <span class="wpcf7-form-control-wrap"><input class="wpcf7-form-control wpcf7-text" type="text" name="c"></span></label><br> <label> Hausnummer<br> <span class="wpcf7-form-control-wrap"><input class="wpcf7-form-control wpcf7-text" type="text" name="d"></span></label><br> <label> Postleitzahl<br> <span class="wpcf7-form-control-wrap"><input class="wpcf7-form-control wpcf7-text" type="text" name="e"></span> </label><br> <label> Ort<br> <span class="wpcf7-form-control-wrap"><input class="wpcf7-form-control wpcf7-text wpcf7-not-valid" type="text" name="f"><span class="wpcf7-not-valid-tip">Bitte füll dieses Feld aus.</span></span> </label> </p>
<p><label> Geburtdatum Kind (ab 6 Jahren)<br> <span class="wpcf7-form-control-wrap"><input class="wpcf7-form-control wpcf7-date" type="date" name="g"></span> </label> </p>
<p><label> Email<br> <span class="wpcf7-form-control-wrap"><input class="wpcf7-form-control wpcf7-email" type="email" name="h"></span> </label><br> <label> Telefonnummer<br> <span class="wpcf7-form-control-wrap"><input class="wpcf7-form-control wpcf7-text" type="text" name="i"></span> </label> </p>
<p><label> Vorname Erziehungsberechtiger<br> <span class="wpcf7-form-control-wrap"><input class="wpcf7-form-control wpcf7-text" type="text" name="j"></span> </label><br> <label> Familienname Erziehungsberechtiger<br> <span class="wpcf7-form-control-wrap"><input class="wpcf7-form-control wpcf7-text" type="text" name="k"></span> </label> </p>
<p><label> Bemerkung/Beweggründe:<br> <span class="wpcf7-form-control-wrap"><textarea cols="40" rows="10" class="wpcf7-form-control wpcf7-textarea" name="l"></textarea></span> </label> </p>
<p><input class="wpcf7-form-control wpcf7-submit has-spinner" type="submit" value="Senden"><span class="wpcf7-spinner"></span> </p>
<div class="wpcf7-response-output" aria-hidden="true"></div>
</form></div></div>
<p class="has-white-color has-vivid-red-background-color has-text-color has-background" style="background-color:#cf2e2e;color:#fff">Sie erhalten nach dem Absenden der Anmeldung eine automatische E-Mail als Eingangsbestätigung. Sollte diese E-Mail nicht angekommen sein, bitten wir um Kontaktaufnahme per <a href="#">E-Mail</a>.</p>
</div></article>
</div>
</main>
</body>
</html>
